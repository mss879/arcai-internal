name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The build only needs these to exist — nothing in CI talks to Supabase.
      # Real values live in Netlify; keeping placeholders here means a missing
      # production secret can never be masked by a green CI run.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://www.arcai.online
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The four checks that have to pass before anything is pushed, in the
      # order that fails fastest.
      - name: Types
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Lint (no new errors)
        run: node scripts/lint-baseline.mjs

      - name: Build
        run: npm run build
